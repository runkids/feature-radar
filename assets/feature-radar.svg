      <path d="M0-34v-12" stroke="#f3d98d" stroke-width="4"/><circle cy="-51" r="6" fill="#fff0bd"/>
      <path d="M-24-5q6-8 12 0M12-5q6-8 12 0M-9 12q9 10 18 0" fill="none" stroke="#5b5260" stroke-width="3" stroke-linecap="round"/>
