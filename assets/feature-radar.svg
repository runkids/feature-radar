      <path d="M37 142v14l9 5" fill="none" stroke="#8b7548" stroke-width="3" stroke-linecap="round"/>
      <text x="73" y="149" fill="#304359" font-size="21" font-weight="700">Past decisions</text>
      <text x="73" y="176" fill="#57677b" font-size="17">Learnings &amp; tradeoffs</text>
    </g>
    <path d="M364 199h66m-9-8 9 8-9 8M766 199h66m-9-8 9 8-9 8" fill="none" stroke="#b4c9d9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 7"/>
    <g transform="translate(600 199)">
      <circle r="142" fill="#203b48" stroke="#729a98" stroke-width="2"/>
      <g fill="none" stroke="#668e8b" opacity=".55"><circle r="106"/><circle r="70"/><path d="M-142 0h284M0-142v284"/></g>
      <path d="M0 0V-142A142 142 0 0 1 123-71Z" fill="url(#sweep)"/>
