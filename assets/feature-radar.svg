    <g fill="#88aa97"><circle cx="879" cy="178" r="4"/><circle cx="879" cy="218" r="4"/><circle cx="879" cy="258" r="4"/></g>
    <text x="600" y="384" text-anchor="middle" fill="#e4ecec" font-size="19">A little radar. A growing memory. A clearer next step.</text>
