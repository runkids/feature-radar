    <text x="68" y="74" fill="#c4d4e7" font-size="16" font-weight="700" letter-spacing="2">KEEP THE CONTEXT</text>
    <g transform="translate(68 100)">
      <rect width="285" height="91" rx="16" fill="#fffaf0"/>
      <rect x="18" y="21" width="37" height="47" rx="6" fill="#e1eae4"/>
      <path d="M27 35h19m-19 10h19m-19 10h12" stroke="#728f80" stroke-width="3" stroke-linecap="round"/>
      <text x="73" y="38" fill="#304359" font-size="21" font-weight="700">Project context</text>
      <text x="73" y="65" fill="#57677b" font-size="17">Architecture &amp; priorities</text>
