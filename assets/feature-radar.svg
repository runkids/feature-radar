<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Feature Radar: find your next meaningful feature</title>
  <desc id="desc">Project context and past decisions feed a friendly radar that highlights promising opportunities. Knowledge is kept in the .feature-radar directory across sessions.</desc>
  <defs>
    <linearGradient id="sky" x2="1" y2="1"><stop stop-color="#19243d"/><stop offset="1" stop-color="#2c4058"/></linearGradient>
    <linearGradient id="sweep" x2="1" y2="0"><stop stop-color="#a7d7bc" stop-opacity=".02"/><stop offset="1" stop-color="#a7d7bc" stop-opacity=".3"/></linearGradient>
  </defs>
  <rect width="1200" height="420" rx="26" fill="url(#sky)"/>
  <g fill="#dce5ff" opacity=".5">
    <circle cx="40" cy="39" r="2"/><circle cx="130" cy="72" r="1.5"/><circle cx="287" cy="32" r="2"/><circle cx="408" cy="65" r="1.5"/><circle cx="485" cy="29" r="2"/><circle cx="709" cy="49" r="2"/><circle cx="824" cy="30" r="1.5"/><circle cx="999" cy="52" r="2"/><circle cx="1161" cy="37" r="2"/>
    <circle cx="35" cy="225" r="1.5"/><circle cx="393" cy="186" r="2"/><circle cx="803" cy="233" r="1.5"/><circle cx="1162" cy="187" r="2"/><circle cx="70" cy="366" r="2"/><circle cx="321" cy="378" r="1.5"/><circle cx="443" cy="337" r="2"/><circle cx="759" cy="370" r="2"/><circle cx="1004" cy="377" r="1.5"/><circle cx="1159" cy="347" r="2"/>
  </g>
